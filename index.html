<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>STICK FARM PRO ULTRA</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&display=swap" rel="stylesheet">
    <style>
        :root { --p: #07FFFF; --bg: #030303; --card: #0d0d0d; --g: #00ff88; --r: #ff3366; --gold: #ffcc00; }
        * { box-sizing: border-box; font-family: 'Orbitron', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: #fff; margin: 0; overflow: hidden; display: flex; flex-direction: column; height: 100vh; }
        
        /* Стилізація елементів */
        .glass { background: var(--card); padding: 15px; border-radius: 12px; border: 1px solid #222; margin-bottom: 15px; }
        input, select { width: 100%; padding: 12px; margin: 8px 0; background: #000; border: 1px solid #333; color: #fff; border-radius: 8px; }
        .btn { width: 100%; padding: 14px; border: none; border-radius: 8px; font-weight: 900; background: var(--p); color: #000; cursor: pointer; text-transform: uppercase; }
        .btn:active { transform: scale(0.98); }

        /* Шапка */
        .header { padding: 15px 20px; display: flex; justify-content: space-between; border-bottom: 1px solid #111; align-items: center; background: #000; }
        .av { width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--p); object-fit: cover; }

        /* Вкладки */
        .view { flex: 1; padding: 20px; display: none; overflow-y: auto; padding-bottom: 90px; }
        .view.active { display: block; animation: fade 0.3s ease; }
        @keyframes fade { from { opacity: 0; } to { opacity: 1; } }

        /* Рулетка */
        .r-wrap { position: relative; width: 200px; height: 200px; margin: 20px auto; }
        .r-box { width: 100%; height: 100%; border-radius: 50%; border: 5px solid #1a1a1a; transition: 5s cubic-bezier(0.1, 0, 0.1, 1); background: conic-gradient(var(--r) 0 170deg, var(--g) 170deg 190deg, #111 190deg 360deg); }
        .r-wrap::after { content: '▼'; position: absolute; top: -10px; left: 50%; transform: translateX(-50%); color: var(--gold); font-size: 20px; z-index: 5; }

        /* Хрестики-Нолики */
        .ttt { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; max-width: 210px; margin: 15px auto; }
        .c { aspect-ratio: 1; background: #000; border: 1px solid #222; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 900; border-radius: 5px; }

        /* Чат */
        #chat { height: 200px; overflow-y: auto; font-size: 13px; margin-bottom: 10px; }
        .m { margin-bottom: 5px; } .m b { color: var(--p); }

        /* Навігація */
        nav { position: fixed; bottom: 0; width: 100%; display: grid; grid-template-columns: repeat(5, 1fr); background: #000; border-top: 1px solid #111; padding: 12px 0 25px; }
        .tab { text-align: center; color: #444; font-size: 22px; cursor: pointer; }
        .tab.active { color: var(--p); }
        .tab span { display: block; font-size: 8px; text-transform: uppercase; margin-top: 4px; }

        /* Майнінг */
        .orb { width: 160px; height: 160px; border-radius: 50%; border: 4px solid var(--g); margin: 30px auto; display: flex; align-items: center; justify-content: center; font-weight: 900; cursor: pointer; box-shadow: 0 0 15px rgba(0,255,136,0.1); }
        .orb.on { border-color: var(--r); animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }
    </style>
</head>
<body>

<div id="auth-scr" style="height:100vh; display:flex; align-items:center; justify-content:center; padding:20px;">
    <div class="glass" style="width:100%; max-width:320px; text-align:center;">
        <h2 style="letter-spacing:5px;">STICK<span style="color:var(--p)">FARM</span></h2>
        <input type="text" id="login-u" placeholder="ЛОГІН">
        <input type="password" id="login-p" placeholder="ПАРОЛЬ">
        <button class="btn" onclick="auth()">УВІЙТИ</button>
    </div>
</div>

<div id="main-scr" style="display:none; flex-direction:column; height:100vh;">
    <div class="header">
        <div><small style="color:#555;">OPERATOR</small><br><b id="h-u">---</b></div>
        <div style="text-align:right;"><small style="color:#555;">BALANCE</small><br><b id="h-b" style="color:var(--g);">0.0000</b></div>
        <img id="h-a" class="av" src="">
    </div>

    <div id="tab1" class="view active">
        <h1 id="v-bal" style="text-align:center; font-size:3.5rem; margin:30px 0; font-weight:900;">0.0000</h1>
        <div id="mbtn" class="orb" onclick="toggleMine()">START MINING</div>
    </div>

    <div id="tab2" class="view">
        <h3 style="color:var(--p); margin-top:0;">SECURE CHAT</h3>
        <div id="chat" class="glass"></div>
        <div style="display:flex; gap:8px;">
            <input type="text" id="msg-in" placeholder="Повідомлення...">
            <button class="btn" style="width:70px;" onclick="sendMsg()">></button>
        </div>
    </div>

    <div id="tab3" class="view">
        <h3 style="margin-top:0;">CASINO</h3>
        <div class="glass" style="text-align:center;">
            <div class="r-wrap"><div id="wheel" class="r-box"></div></div>
            <input type="number" id="bet-amt" placeholder="СТАВКА">
            <div style="display:flex; gap:5px;">
                <button class="btn" style="background:var(--r); color:#fff;" onclick="spin('red')">RED</button>
                <button class="btn" style="background:#000; border:1px solid #333;" onclick="spin('black')">BLACK</button>
                <button class="btn" style="background:var(--g); color:#000;" onclick="spin('green')">0</button>
            </div>
        </div>
        <h3>TIC-TAC-TOE</h3>
        <div class="glass">
            <select id="ttt-friend"><option>Оберіть друга...</option></select>
            <button class="btn" onclick="alert('Запит надіслано!')">ВИКЛИКАТИ НА ГРУ</button>
            <div class="ttt">
                <div class="c" onclick="this.innerText='X'"></div><div class="c" onclick="this.innerText='O'"></div><div class="c"></div>
                <div class="c"></div><div class="c"></div><div class="c"></div>
                <div class="c"></div><div class="c"></div><div class="c"></div>
            </div>
        </div>
    </div>

    <div id="tab4" class="view">
        <h3>SQUAD</h3>
        <div style="display:flex; gap:8px;">
            <input type="text" id="f-u" placeholder="Логін...">
            <button class="btn" style="width:80px;" onclick="addF()">ADD</button>
        </div>
        <div id="f-list" style="margin-top:20px;"></div>
    </div>

    <div id="tab5" class="view">
        <h3>OS CONFIG</h3>
        <div class="glass">
            <label style="font-size:10px; color:var(--p);">AVATAR URL</label>
            <input type="text"
